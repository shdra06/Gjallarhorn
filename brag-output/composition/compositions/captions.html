  <div id="root" data-composition-id="captions" data-width="1920" data-height="1080" data-layout-allow-caption-zone>
    <div id="cap-0" class="cap clip" data-start="0.55" data-duration="2.55"><span>A customer hid one sentence in a chat message.</span></div>
    <div id="cap-1" class="cap clip" data-start="3.45" data-duration="3.34"><span>Three agents later, fifty thousand rupees were about to leave.</span></div>
    <div id="cap-2" class="cap clip" data-start="7.65" data-duration="1.39"><span>Gjallarhorn caught it mid-air.</span></div>
    <div id="cap-3" class="cap clip" data-start="12.24" data-duration="2.52"><span>Lock a rogue agent in under two milliseconds.</span></div>
    <div id="cap-4" class="cap clip" data-start="15.21" data-duration="1.87"><span>Let an AI co-pilot write the fix,</span></div>
    <div id="cap-5" class="cap clip" data-start="17.1" data-duration="1.23"><span>and prove it first.</span></div>
    <div id="cap-6" class="cap clip" data-start="18.78" data-duration="2.01"><span>Thirty-one attacks. Zero harm.</span></div>
    <div id="cap-7" class="cap clip" data-start="21.39" data-duration="1.07"><span>Let me show you how.</span></div>
    <div id="cap-8" class="cap clip" data-start="23.81" data-duration="1.86"><span>Teams now run many AI agents.</span></div>
    <div id="cap-9" class="cap clip" data-start="25.69" data-duration="1.79"><span>They call models, use tools,</span></div>
    <div id="cap-10" class="cap clip" data-start="27.5" data-duration="1.97"><span>and ask each other for help.</span></div>
    <div id="cap-11" class="cap clip" data-start="30.02" data-duration="1.45"><span>When one of them is tricked,</span></div>
    <div id="cap-12" class="cap clip" data-start="31.49" data-duration="2.45"><span>today's gateways can't tell you which agent did</span></div>
    <div id="cap-13" class="cap clip" data-start="33.96" data-duration="0.97"><span>it, who asked whom,</span></div>
    <div id="cap-14" class="cap clip" data-start="34.95" data-duration="2.09"><span>or whether a permission was borrowed.</span></div>
    <div id="cap-15" class="cap clip" data-start="37.6" data-duration="2.74"><span>OWASP calls that last one a confused deputy.</span></div>
    <div id="cap-16" class="cap clip" data-start="40.88" data-duration="2.5"><span>Gjallarhorn is a plugin for the Bifrost AI</span></div>
    <div id="cap-17" class="cap clip" data-start="43.4" data-duration="1.83"><span>gateway that answers all three,</span></div>
    <div id="cap-18" class="cap clip" data-start="45.25" data-duration="0.99"><span>on every call.</span></div>
    <div id="cap-19" class="cap clip" data-start="48.14" data-duration="1.59"><span>This is the live console.</span></div>
    <div id="cap-20" class="cap clip" data-start="49.75" data-duration="2.55"><span>Every flight is a real call crossing the</span></div>
    <div id="cap-21" class="cap clip" data-start="52.32" data-duration="2.03"><span>gateway, between people, agents,</span></div>
    <div id="cap-22" class="cap clip" data-start="54.37" data-duration="1.24"><span>tools and models.</span></div>
    <div id="cap-23" class="cap clip" data-start="56.85" data-duration="2.83"><span>Here's an attack. A customer message tells the</span></div>
    <div id="cap-24" class="cap clip" data-start="59.7" data-duration="1.83"><span>support agent to get a refund.</span></div>
    <div id="cap-25" class="cap clip" data-start="61.55" data-duration="1.96"><span>Support isn't allowed to refund,</span></div>
    <div id="cap-26" class="cap clip" data-start="63.53" data-duration="2.56"><span>so it asks the billing agent, which is.</span></div>
    <div id="cap-27" class="cap clip" data-start="67.21" data-duration="1.5"><span>Bifrost allows every hop.</span></div>
    <div id="cap-28" class="cap clip" data-start="68.73" data-duration="1.98"><span>Gjallarhorn sees the whole chain,</span></div>
    <div id="cap-29" class="cap clip" data-start="70.73" data-duration="1.9"><span>and the refund stops mid-air.</span></div>
    <div id="cap-30" class="cap clip" data-start="73.51" data-duration="1.6"><span>One click opens the incident:</span></div>
    <div id="cap-31" class="cap clip" data-start="75.13" data-duration="1.82"><span>the chain from the customer chat,</span></div>
    <div id="cap-32" class="cap clip" data-start="76.97" data-duration="1.54"><span>through support, to billing,</span></div>
    <div id="cap-33" class="cap clip" data-start="78.53" data-duration="1.77"><span>and the rule that stopped it.</span></div>
    <div id="cap-34" class="cap clip" data-start="80.71" data-duration="2.58"><span>The AI co-pilot explains it in plain words,</span></div>
    <div id="cap-35" class="cap clip" data-start="83.31" data-duration="2.7"><span>using only facts from the flight recorder.</span></div>
    <div id="cap-36" class="cap clip" data-start="86.51" data-duration="1.36"><span>If an agent misbehaves,</span></div>
    <div id="cap-37" class="cap clip" data-start="87.89" data-duration="0.82"><span>I can lock it.</span></div>
    <div id="cap-38" class="cap clip" data-start="88.73" data-duration="1.84"><span>Billing is cut off from models,</span></div>
    <div id="cap-39" class="cap clip" data-start="90.59" data-duration="2.32"><span>tools and other agents on its very next</span></div>
    <div id="cap-40" class="cap clip" data-start="92.93" data-duration="3.27"><span>call, and the people it works for keep their access.</span></div>
    <div id="cap-41" class="cap clip" data-start="96.6" data-duration="2.18"><span>We measured it. The next call is refused</span></div>
    <div id="cap-42" class="cap clip" data-start="98.8" data-duration="3.23"><span>a median of one point eight milliseconds after the lock.</span></div>
    <div id="cap-43" class="cap clip" data-start="105.43" data-duration="1.36"><span>No policy is perfect.</span></div>
    <div id="cap-44" class="cap clip" data-start="106.81" data-duration="2.66"><span>Here I remove the rule that stops outside</span></div>
    <div id="cap-45" class="cap clip" data-start="109.49" data-duration="1.86"><span>chains from sending email.</span></div>
    <div id="cap-46" class="cap clip" data-start="111.66" data-duration="1.74"><span>The replay check calls it safe,</span></div>
    <div id="cap-47" class="cap clip" data-start="113.42" data-duration="2.35"><span>because nothing recorded needed that rule.</span></div>
    <div id="cap-48" class="cap clip" data-start="115.79" data-duration="0.72"><span>So I save.</span></div>
    <div id="cap-49" class="cap clip" data-start="117.01" data-duration="2.36"><span>Now a forum post tricks an agent into</span></div>
    <div id="cap-50" class="cap clip" data-start="119.39" data-duration="1.72"><span>emailing customer data out.</span></div>
    <div id="cap-51" class="cap clip" data-start="121.13" data-duration="1.69"><span>This time, harm is done.</span></div>
    <div id="cap-52" class="cap clip" data-start="123.53" data-duration="1.64"><span>I find the call in the table,</span></div>
    <div id="cap-53" class="cap clip" data-start="125.19" data-duration="2.49"><span>open it, and ask the co-pilot for a rule.</span></div>
    <div id="cap-54" class="cap clip" data-start="129.69" data-duration="1.79"><span>It doesn't trust its own ideas.</span></div>
    <div id="cap-55" class="cap clip" data-start="131.5" data-duration="3.93"><span>Every suggestion is replayed against all the traffic we recorded.</span></div>
    <div id="cap-56" class="cap clip" data-start="135.85" data-duration="1.46"><span>These three are proven safe.</span></div>
    <div id="cap-57" class="cap clip" data-start="137.55" data-duration="1.79"><span>Six were rejected on their own:</span></div>
    <div id="cap-58" class="cap clip" data-start="139.36" data-duration="1.67"><span>five would block normal work,</span></div>
    <div id="cap-59" class="cap clip" data-start="141.05" data-duration="1.43"><span>and one was malformed.</span></div>
    <div id="cap-60" class="cap clip" data-start="142.71" data-duration="1.12"><span>I apply a proven rule,</span></div>
    <div id="cap-61" class="cap clip" data-start="143.85" data-duration="2.96"><span>and the server proves it again before switching it on.</span></div>
    <div id="cap-62" class="cap clip" data-start="149.69" data-duration="2.16"><span>Same attack, one more time. Blocked.</span></div>
    <div id="cap-63" class="cap clip" data-start="155.65" data-duration="3.07"><span>Every decision lands in a hash-chained flight recorder.</span></div>
    <div id="cap-64" class="cap clip" data-start="158.74" data-duration="2.4"><span>I can replay the last minute of traffic,</span></div>
    <div id="cap-65" class="cap clip" data-start="161.36" data-duration="2.41"><span>open any agent, browse every call in the</span></div>
    <div id="cap-66" class="cap clip" data-start="163.79" data-duration="2.65"><span>table, and test a policy change against real</span></div>
    <div id="cap-67" class="cap clip" data-start="166.46" data-duration="1.67"><span>traffic before I save it.</span></div>
    <div id="cap-68" class="cap clip" data-start="170.68" data-duration="2.41"><span>Under the hood, Gjallarhorn is a Go plugin</span></div>
    <div id="cap-69" class="cap clip" data-start="173.11" data-duration="2.64"><span>that Bifrost loads through its official hooks.</span></div>
    <div id="cap-70" class="cap clip" data-start="175.77" data-duration="1.36"><span>Bifrost isn't forked.</span></div>
    <div id="cap-71" class="cap clip" data-start="177.68" data-duration="1.7"><span>When one agent calls another,</span></div>
    <div id="cap-72" class="cap clip" data-start="179.4" data-duration="1.94"><span>the gateway signs a chain ticket.</span></div>
    <div id="cap-73" class="cap clip" data-start="181.36" data-duration="1.11"><span>Agents can drop it,</span></div>
    <div id="cap-74" class="cap clip" data-start="182.49" data-duration="1.57"><span>but they can't forge it.</span></div>
    <div id="cap-75" class="cap clip" data-start="184.61" data-duration="2.74"><span>Every model, tool and agent call is checked</span></div>
    <div id="cap-76" class="cap clip" data-start="187.37" data-duration="1.84"><span>against lockdowns and policy,</span></div>
    <div id="cap-77" class="cap clip" data-start="189.23" data-duration="1.78"><span>in about fifty microseconds,</span></div>
    <div id="cap-78" class="cap clip" data-start="191.03" data-duration="2.14"><span>and every decision is recorded.</span></div>
    <div id="cap-79" class="cap clip" data-start="194.88" data-duration="1.82"><span>To prove it, we built an attack lab:</span></div>
    <div id="cap-80" class="cap clip" data-start="196.72" data-duration="2.39"><span>thirty-one attacks through the real gateway.</span></div>
    <div id="cap-81" class="cap clip" data-start="199.66" data-duration="2.9"><span>Without Gjallarhorn, twelve of them caused real harm.</span></div>
    <div id="cap-82" class="cap clip" data-start="202.58" data-duration="1.14"><span>With it, none did.</span></div>
    <div id="cap-83" class="cap clip" data-start="204.27" data-duration="2.48"><span>All eleven pieces of normal work still got</span></div>
    <div id="cap-84" class="cap clip" data-start="206.77" data-duration="1.88"><span>done, with zero false blocks.</span></div>
    <div id="cap-85" class="cap clip" data-start="209.2" data-duration="2.4"><span>Every number links to its raw result file,</span></div>
    <div id="cap-86" class="cap clip" data-start="211.62" data-duration="2.87"><span>and the threat model says plainly what Gjallarhorn</span></div>
    <div id="cap-87" class="cap clip" data-start="214.51" data-duration="1.59"><span>does not protect against.</span></div>
    <div id="cap-88" class="cap clip" data-start="217.8" data-duration="1.9"><span>It's open source. Clone the repo,</span></div>
    <div id="cap-89" class="cap clip" data-start="219.72" data-duration="2.89"><span>run one command, and launch an attack yourself.</span></div>
    <div id="cap-90" class="cap clip" data-start="223.31" data-duration="2.49"><span>Gjallarhorn. The horn that warns you when your</span></div>
    <div id="cap-91" class="cap clip" data-start="225.82" data-duration="1.02"><span>agents go wrong.</span></div>
  </div>
