name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  engine:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: engine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.3"
          cache-dependency-path: engine/go.mod
      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - name: vet
        run: go vet ./...
      - name: test (race)
        run: go test -race -count=1 -coverprofile=coverage.out ./...
      - name: coverage
        run: go tool cover -func=coverage.out | tail -1
      - name: fuzz ticket verification (30s)
        run: go test ./ticket -run XXX -fuzz FuzzVerify -fuzztime 30s

  demo:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: demo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.3"
          cache-dependency-path: demo/go.sum
      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - name: vet
        run: go vet ./...
      - name: test
        run: go test -race -count=1 ./...

  console:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: console
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.19.0"
          cache: npm
          cache-dependency-path: console/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: typecheck
        run: npm run typecheck
      - name: test
        run: npm test
      - name: build
        run: npm run build

  plugin-image:
    # Builds Bifrost (dynamically linked) and the Gjallarhorn plugin together, then runs the
    # integration tests against the real gateway.
    runs-on: ubuntu-latest
    needs: [engine, demo, console]
    steps:
      - uses: actions/checkout@v4
      - name: build images
        run: |
          docker build -t gjallarhorn-bifrost -f deploy/Containerfile .
          sed -i 's#FROM localhost/gjallarhorn-bifrost:latest#FROM gjallarhorn-bifrost#' deploy/dev/Containerfile
          docker build -t gjallarhorn-dev -f deploy/dev/Containerfile .
      - name: integration tests
        run: ENGINE=docker bash deploy/dev/test.sh
      - name: attack lab (monitor baseline, enforcing, co-pilot drill)
        run: |
          sed -i 's#FROM localhost/gjallarhorn-bifrost:latest#FROM gjallarhorn-bifrost#' deploy/demo/Containerfile
          docker build -t gjallarhorn-demo -f deploy/demo/Containerfile .
          ENGINE=docker bash deploy/demo/run-lab.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: attack-lab-report
          path: results/
